- id: weirauchWoWWritingWax2021
  abstract: >-
    The earliest references to the use of wax boards date from the third
    millennium BCE. From a structural and functional point of view, wax diptychs
    can be truly considered as proto-codices, i.e. the earliest form of the
    modern book.¹ Used without interruption for more than three millennia for a
    variety of scripts in a number of different cultures, wax boards represent
    the longest-lived writing medium in human history. In the following
    discussion, we will focus on the earliest history of this medium as attested
    in the cuneiform cultures of the Ancient Near East, and on what those

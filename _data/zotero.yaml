- id: cesterosWrittenBloodDecoding2021
  abstract: >-
    Due to the large number of preserved magical texts and artefacts (amulets,
    lead tablets, ostraca, engraved gemstones, etc.), Greco-Roman Egypt offers
    one of the richest contexts for the study of the phenomenon of magic in
    Antiquity.* The significance of these documentary and archaeological
    witnesses lies in the fact that they provide direct evidence of the practice
    of magic in this period.¹ Among them, the so-called magical papyri stand out

- id: knoxRecoveryLostWritings2003
  abstract: >-
    Modern digital imaging techniques have been applied to the recovery of
    erased and overwritten writings on historical parchment manuscripts. In our
    work, we have found that images obtained under different illuminations can
    increase the contrast of erased or faded writings on parchment. This paper
    focuses on the use of ultraviolet illumination, which causes parchment to
    fluoresce, emitting visible light towards the blue end of the spectrum. This
    fluorescence increases the contrast of both faded and erased iron gall inks
    on parchment. On the thousand-yearold Archimedes Palimpsest, fluorescence
    imaging, together with post-capture image processing, makes much of the
    erased Archimedes text visible to the classical mathematics scholars who are
    trying to read it. In addition, we have found that ultraviolet reflectance
    imaging has been able to reveal characters on a scraped page of a
    five-hundred-yearold Hebrew prayer book that showed little evidence of
    characters under ultraviolet fluorescent imaging. The physical mechanisms
    for these differences are not well understood, but they can be used to
    recover writings that otherwise would be lost forever.
  author:
    - family: Knox
      given: Keith T
    - family: Easton
      given: Roger L
  citation-key: knoxRecoveryLostWritings2003
  issued:
    - year: 2003
  language: en
  source: Zotero
  title: >-
    Recovery of Lost Writings on Historical Manuscripts with Ultraviolet
    Illumination
  type: article-journal


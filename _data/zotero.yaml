- id: DifferencesParchmentVellum2016
  abstract: >-
    The term parchment is a general term for an animal skin which has been
    prepared for writing or printing. Parchment has been made for centuries, and
    is usually calf, goat, or sheep skin. The term vellum from the French veau
    refers to a parchment made from calf skin. The manufacture of parchment is
    quite involved. After the skin is removed from the animal and any hair or
    flesh is cleaned away, it is stretched on a wooden frame. While it is
    stretched, the parchment maker or parchminer scrapes the surface of the skin
    with a special curved knife.

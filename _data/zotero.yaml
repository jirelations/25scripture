- id: Quill2025
  abstract: >-
    A quill is a writing tool made from a moulted flight feather (preferably a
    primary wing-feather) of a large bird. Quills were used for writing with ink
    before the invention of the dip pen/metal-nibbed pen, the fountain pen, and,
    eventually, the ballpoint pen.


    As with the earlier reed pen (and later dip pen), a quill has no internal
    ink reservoir and therefore needs to periodically be dipped into an inkwell
    during writing. The hand-cut goose quill is rarely used as a calligraphy
    tool anymore because many papers are now derived from wood pulp and would
    quickly wear a quill down. However, it is still the tool of choice for a few
    scribes who have noted that quills provide an unmatched sharp stroke as well
    as greater flexibility than a steel pen.
